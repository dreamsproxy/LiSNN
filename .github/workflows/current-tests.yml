name: Active LiSNN tests

on:
  push:
    branches:
      - main
      - cleanup/**
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install active test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Run active tests
        run: python -m pytest -q


      - name: Run all active smoke tests
        run: python debug.py --log-dir logs/ci-smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: logs/ci-smoke/
          if-no-files-found: ignore
